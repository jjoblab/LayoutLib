# gradle/libs.versions.toml — catalogue centralisé des versions
# Source de vérité unique pour les coordonnées de dépendances et de plugins
# (point 10 : les versions étaient dupliquées dans 8 build.gradle.kts).
#
# @author jo@Dev
# @since 3.0

[versions]
# Build — aligné sur CodeIDE (décision propriétaire 2026-10-13) pour un
# environnement unique : même Gradle 9.7.1 (wrapper), même JDK 21, mêmes
# versions AGP/AndroidX → démon Gradle et caches partagés entre les deux
# dépôts, et compatibilité du build composite (CodeIDE consomme LayoutLib
# par includeBuild + substitution, plus de JitPack).
agp = "9.4.1"

# v3.7.0 — S9 (étude PE14 § 5.4) : Compose C0, le SPIKE. Kotlin aligné sur
# CodeIDE (2.2.10 — démon/caches partagés) ; le plugin compose est porté PAR
# Kotlin depuis 2.0 (même version) ; le BOM est la dernière stable Google Maven.
kotlin = "2.2.10"
composeBom = "2026.09.00"

# AndroidX / Material — versions partagées avec CodeIDE
# (gradle/libs.versions.toml de CodeIDE = source de vérité).
androidxAnnotation = "1.10.0"
androidxCore = "1.19.0"
androidxAppcompat = "1.8.0"
androidxRecyclerview = "1.4.0"
androidxConstraintlayout = "2.1.4"
material = "1.14.0"

# v3.4.9 — bibliothèques que le ViewTagRegistry référence : elles doivent
# être sur le classpath de l'hôte pour que les vues existent (sinon MockView).
# viewpager2/swiperefreshlayout = versions de CodeIDE ; les autres sont les
# seules stables de Google Maven (cardview/gridlayout 1.0.0,
# drawerlayout 1.1.1, viewpager legacy 1.1.0).
androidxViewpager = "1.1.0"
androidxViewpager2 = "1.1.0"
androidxCardview = "1.0.0"
androidxGridlayout = "1.0.0"
androidxDrawerlayout = "1.1.1"
androidxSwiperefreshlayout = "1.2.0"

# Tests JVM
junitJupiter = "5.10.2"
# Gradle 9 exige le lanceur JUnit Platform EXPLICITE sur le classpath
# de test (Gradle 8 l'ajoutait implicitement) — version alignée sur la
# plateforme de jupiter 5.10.2 (série 1.10.2).
junitPlatformLauncher = "1.10.2"
assertj = "3.26.0"
kxml2 = "2.3.0"
mockito = "5.14.2"

# Tests instrumentés Android
androidxTestExtJunit = "1.1.5"
androidxTestRunner = "1.5.2"
espressoCore = "3.5.1"

# Externe : github.com/jjoblab/code-editor (JitPack, tag Git) — même
# version que CodeIDE (compatibilité vérifiée 3.41.0 → 3.49.2 : ajouts
# purs d'API, aucune méthode publique retirée).
codeEditor = "3.49.2"

[libraries]
# AndroidX / Material
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# v3.7.0 — S9 (Compose C0) : le runtime Compose EMBARQUÉ dans le harnais de
# spike (miroir PC1 : le pack preview l'embarquera pour :preview). Les
# versions viennent TOUTES du BOM — jamais de version directe.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "androidxViewpager" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidxViewpager2" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-gridlayout = { module = "androidx.gridlayout:gridlayout", version.ref = "androidxGridlayout" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "androidxDrawerlayout" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }

# Tests JVM — junit-jupiter (agrégat api+params+engine) suffit pour
# testImplementation ; plus besoin de déclarer api/engine séparément.
# Le lanceur (testRuntimeOnly) : exigence Gradle 9, voir [versions].
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Tests instrumentés Android
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

# Externe : code-editor (dépôt multi-modules JitPack → com.github.jjoblab.code-editor)
code-editor = { module = "com.github.jjoblab.code-editor:cel-ui", version.ref = "codeEditor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
