# gradle/libs.versions.toml — catalogue centralisé des versions
# Source de vérité unique pour les coordonnées de dépendances et de plugins
# (point 10 : les versions étaient dupliquées dans 8 build.gradle.kts).
#
# @author jo@Dev
# @since 3.0

[versions]
# Build
agp = "8.5.0"

# AndroidX / Material
androidxAnnotation = "1.8.0"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxRecyclerview = "1.3.2"
androidxConstraintlayout = "2.1.4"
material = "1.12.0"

# Tests JVM
junitJupiter = "5.10.2"
assertj = "3.26.0"
kxml2 = "2.3.0"
mockito = "5.14.2"

# Tests instrumentés Android
androidxTestExtJunit = "1.1.5"
androidxTestRunner = "1.5.2"
espressoCore = "3.5.1"

# Externe : github.com/jjoblab/code-editor (JitPack, tag Git)
codeEditor = "v3.41.0"

[libraries]
# AndroidX / Material
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Tests JVM — junit-jupiter (agrégat api+params+engine) suffit pour
# testImplementation ; plus besoin de déclarer api/engine séparément.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Tests instrumentés Android
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

# Externe : code-editor (dépôt multi-modules JitPack → com.github.jjoblab.code-editor)
code-editor = { module = "com.github.jjoblab.code-editor:cel-ui", version.ref = "codeEditor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
