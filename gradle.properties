# LayoutLib — configuration Gradle commune.
# Alignée sur CodeIDE (décision propriétaire 2026-10-13) : mêmes réglages
# mémoire/parallélisme, même wrapper 9.7.1, même JDK 21 → les deux dépôts
# partagent UN environnement (démon Gradle réutilisé entre builds, caches
# partagés, plus de mémoire disponible pour les builds successifs).

# Machine virtuelle du démon Gradle — IDENTIQUE à CodeIDE (sinon deux
# démons cohabitent et se disputent les 4 Go de la machine).
org.gradle.jvmargs=-Xmx2536m -Dfile.encoding=UTF-8

# Parallélisme SÉQUENTIEL comme CodeIDE : machine 4 Go / 2 cœurs, les JVM
# de test empilées en parallèle déclenchent l'OOM killer du noyau.
org.gradle.parallel=false
org.gradle.workers.max=1

# Caches (build + configuration) actifs.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Démon persistant (l'environnement reste chaud entre les builds des deux
# dépôts).
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# UTF-8 et locale invariables (héritage AndroidCS).
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US

# Bibliothèques AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Revu (point 10) : R final autorisé car aucune interception runtime des
# champs R (pas de modification de R à l'exécution) ; perf légèrement
# meilleure.
android.nonFinalResIds=false

# Revu (point 10) : le flag global déprécié
# android.defaults.buildfeatures.buildconfig=true est retiré ; seul
# layout-editor-app (CrashActivity -> BuildConfig.DEBUG) active BuildConfig
# dans son build.gradle.kts.
