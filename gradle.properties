#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Mon Sep 07 18:53:07 GMT 2026
org.gradle.caching=true
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true
systemProp.sun.jnu.encoding=UTF-8
# Revu (point 10) : R final autorisé car aucune interception runtime des
# champs R (pas de modification de R à l'exécution) ; perf légèrement meilleure.
android.nonFinalResIds=false
systemProp.file.encoding=UTF-8
org.gradle.configuration-cache=false
# Revu (point 10) : le flag global déprécié
# android.defaults.buildfeatures.buildconfig=true est retiré ; seul
# layout-editor-app (CrashActivity -> BuildConfig.DEBUG) active BuildConfig
# dans son build.gradle.kts.
