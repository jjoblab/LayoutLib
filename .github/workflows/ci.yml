# .github/workflows/ci.yml — intégration continue LayoutLib
# @author jo@Dev
# @since 3.0
#
# Vérifie à chaque push/PR : tests JVM de tous les modules, build debug
# de l'application et lint. JDK 17 requis (AGP 8.5).

name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main, improvements]

jobs:
  build:
    name: Tests + Build + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Tests unitaires (tous modules)
        run: ./gradlew testAllModules --console=plain

      - name: Build debug (application)
        run: ./gradlew :layout-editor-app:assembleDebug --console=plain

      - name: Lint (application)
        run: ./gradlew :layout-editor-app:lintDebug --console=plain

      - name: Upload rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-echec
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
          if-no-files-found: ignore
