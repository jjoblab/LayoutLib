# .github/workflows/ci.yml — intégration continue LayoutLib
# @author jo@Dev
# @since 3.0
#
# Vérifie à chaque push/PR : tests JVM de tous les modules, build debug
# de l'application et lint.
#
# Environnement ALIGNÉ sur CodeIDE (décision propriétaire 2026-10-13) :
# JDK 21 (Temurin), Gradle 9.7.1 (wrapper), AGP 9.4.1, compileSdk 37 —
# un seul outillage pour les deux dépôts.

name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main, improvements]

jobs:
  build:
    name: Tests + Build + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Même rite que CodeIDE : les licences du SDK préinstallé du runner
      # sont déjà acceptées ; ceci permet à sdkmanager d'auto-installer la
      # plateforme 37 si elle manque (compileSdk 37).
      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Tests unitaires (tous modules)
        run: ./gradlew testAllModules --console=plain

      - name: Build debug (application)
        run: ./gradlew :layout-editor-app:assembleDebug --console=plain

      - name: Lint (application)
        run: ./gradlew :layout-editor-app:lintDebug --console=plain

      - name: Upload rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-echec
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
          if-no-files-found: ignore
